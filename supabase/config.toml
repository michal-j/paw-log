# Supabase CLI settings for a LOCAL stack only (`npx supabase start`, needs Docker).
# The hosted project is configured in the dashboard: see docs/runbooks/supabase-setup.md.
# These values mirror what the runbook sets there.
project_id = "paw-log"

[api]
schemas = ["public"]

[auth]
site_url = "http://localhost:5175"
additional_redirect_urls = []
# Two accounts only, created by hand in the dashboard. Nobody can sign up.
enable_signup = false
minimum_password_length = 12

[auth.email]
# E-mail + password sign-in. No sign-up, no magic link.
enable_signup = false
