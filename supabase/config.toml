# Supabase CLI settings for a LOCAL stack only (`npx supabase start`, needs Docker).
# The hosted project is configured in the dashboard: see docs/runbooks/supabase-setup.md.
# These values mirror what the runbook sets there.
project_id = "paw-log"

[api]
schemas = ["public"]

[auth]
site_url = "http://localhost:5175"
additional_redirect_urls = []
# Two accounts only, created by hand. Nobody can sign up.
enable_signup = false

[auth.email]
enable_signup = false
# Six-digit code typed into the app, no magic link.
otp_length = 6
otp_expiry = 900

[auth.email.template.magic_link]
subject = "PawLog code / Kod PawLog"
content_path = "./supabase/templates/sign-in-code.html"
