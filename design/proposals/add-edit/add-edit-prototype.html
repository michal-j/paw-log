<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PawLog Logging</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=Instrument+Sans:wght@500;600;700&display=swap">
<style>
/* Tokens: copied 1:1 from docs/design-system/tokens.json. Layout, sizes and type follow the R10 prototype (design/prototype/head.html). */
:root{--ground:#f6f8f7;--surface:#ffffff;--surface-tint:#fafcfb;--ink:#0e1512;--ink-2:#46504b;--ink-3:#6b756f;--line:#e6ebe8;--line-strong:#d5dcd8;--mint:#1fd38a;--mint-top:#3be0a0;--mint-deep:#0a7a52;--mint-bg:#e8faf2;--mint-line:#bdebd6;--on-mint:#04251a;--meal-column:#1fd38a0f;--danger:#b3282f;--food-cooked:#bfe04a;--food-farm:#c99d6c;--food-ocean:#ff9585;--med-arvelin:#86b1f7;--med-bellavet:#ffb85c;--med-gastrelle:#b59bf2;--med-biomend:#5dcfc8;--med-calmora:#a8b3c0;--treat:#f486c3;--mark-neutral:#a3aea8;--badge-vet-top:#e9faf2;--badge-vet-bottom:#d3f3e4;--badge-vet-ink:#0a7a52;--badge-vet-line:#a8e6cb;--badge-sym-top:#ffeeec;--badge-sym-bottom:#ffdcd8;--badge-sym-ink:#b3282f;--badge-sym-line:#f4b5af;--badge-photo-top:#f3efff;--badge-photo-bottom:#e5deff;--badge-photo-ink:#5b3fb0;--badge-photo-line:#c9bcf2;--badge-front-top:#eaf3ff;--badge-front-bottom:#d8e8ff;--badge-front-ink:#2455a6;--badge-front-line:#b1cdf3;--badge-worm-top:#fff6e0;--badge-worm-bottom:#ffebc2;--badge-worm-ink:#8a5a00;--badge-worm-line:#f0d08c;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--radius-xs:4px;--radius-sm:6px;--radius-md:8px;--radius-lg:10px;--radius-sheet:16px;--radius-full:999px;--shadow-button:0 1px 2px rgba(14,21,18,0.06);--shadow-primary:0 1px 2px rgba(10,122,82,0.35), 0 3px 8px -3px rgba(31,211,138,0.55), inset 0 1px 0 rgba(255,255,255,0.35);--shadow-card:0 1px 2px rgba(14,21,18,0.05), 0 4px 12px -6px rgba(14,21,18,0.08);--shadow-badge:0 1px 1.5px rgba(14,21,18,0.10), inset 0 1px 0 rgba(255,255,255,0.7);--shadow-bar-top:0 2px 5px -3px rgba(14,21,18,0.14);--shadow-bar-bottom:0 -3px 10px -6px rgba(14,21,18,0.16);--shadow-sheet:0 -6px 24px -8px rgba(14,21,18,0.2);--font-sans:"Onest", system-ui, sans-serif;--font-display:"Instrument Sans", "Onest", system-ui, sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-sans);font-size:13px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:opacity .15s ease,background-color .15s ease,border-color .15s ease}
input,select,textarea{font:inherit;color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--mint-deep);outline-offset:2px}
.disp{font-family:var(--font-display);letter-spacing:-0.02em}
.cap{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.ink2{color:var(--ink-2)}.ink3{color:var(--ink-3)}.deep{color:var(--mint-deep)}
.sm{position:relative}.sm::after{content:"";position:absolute;left:-4px;right:-4px;top:-5px;bottom:-5px}
.ghost{border:1px solid var(--line-strong);background:linear-gradient(180deg,var(--surface),var(--surface-tint));color:var(--ink);box-shadow:var(--shadow-button)}
.ghost:active{opacity:.55}
.pri{border:0;color:var(--on-mint);background:linear-gradient(180deg,var(--mint-top),var(--mint));box-shadow:var(--shadow-primary)}
.pri:active{opacity:.78}
.pri[disabled]{opacity:.45}
.card{background:linear-gradient(180deg,var(--surface),var(--surface-tint));border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-card)}
.tap:active{opacity:.6}

/* page + flows panel (wide screens only) */
.page{min-height:100vh;display:flex;justify-content:center;align-items:flex-start;gap:var(--space-6)}
.flows{display:none}
@media (min-width:820px){.page{padding:var(--space-6)}.flows{display:block;width:260px;position:sticky;top:var(--space-6)}.phone{border-radius:var(--radius-sheet);box-shadow:var(--shadow-card);border:1px solid var(--line)}}
.flows .card{padding:var(--space-4)}
.flows button{display:block;width:100%;text-align:left;min-height:40px;padding:0 var(--space-3);margin-top:var(--space-2);border-radius:var(--radius-md);font-size:13px;font-weight:600}
.phone{position:relative;width:390px;max-width:100vw;height:844px;max-height:100vh;overflow:hidden;background:var(--ground);display:flex;flex-direction:column}
@media (max-width:819px){.page{display:block}.phone{width:100%;height:100vh;height:100dvh;max-height:none}}
.frame .phone{max-width:390px;height:844px}
#screen{flex:1;min-height:0;display:flex;flex-direction:column}

/* R10 top bar and day nav */
.topbar{display:flex;align-items:center;padding:10px 12px 0;flex:none}
.btn34{height:34px;border-radius:var(--radius-md);font-size:14px;font-weight:600;display:flex;align-items:center;gap:4px}
.daynav{display:flex;align-items:center;gap:4px;padding:6px 10px 10px;flex:none}
.sq36{flex:none;width:36px;height:36px;border-radius:var(--radius-md);padding:0;display:flex;align-items:center;justify-content:center}
.sq36[disabled]{opacity:.3}
.daytitle{font-family:var(--font-display);font-size:19px;font-weight:600;line-height:24px;letter-spacing:-0.025em}
.body{flex:1;min-height:0;overflow-y:auto;padding:0 12px 20px;border-top:1px solid var(--line);scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.sec{display:flex;align-items:center;justify-content:space-between;margin:16px 4px 8px;min-height:20px}
.seclink{border:0;background:none;padding:0 4px;min-height:44px;margin:-12px -4px;font-size:12px;font-weight:600;color:var(--mint-deep);display:flex;align-items:center;gap:2px}

/* R10 cards in "What happened" */
.ecard{display:block;width:100%;text-align:left;padding:13px;margin-bottom:8px}
.ehead{display:flex;align-items:center;gap:9px}
.etitle{font-size:15px;font-weight:600;letter-spacing:-0.01em}
.etext{font-size:13px;line-height:19px;color:var(--ink-2);margin-top:6px}
.echips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.echip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:var(--radius-sm);background:var(--mint-bg);border:1px solid var(--mint-line);color:var(--mint-deep)}
.srow{display:flex;justify-content:space-between;gap:12px;width:100%;font-size:14px;line-height:20px;min-height:44px;align-items:center;border:0;background:transparent;padding:0;text-align:left}
.srow + .srow{border-top:1px solid var(--line)}
.srow .r{color:var(--ink-2);text-align:right}
.srow:active{opacity:.6}

/* EventBadge (copied, not restyled) */
.badge{display:inline-flex;align-items:center;justify-content:center;gap:2px;height:18px;min-width:18px;padding:0 4px;border-radius:var(--radius-sm);font-size:11px;line-height:16px;font-weight:800;box-shadow:var(--shadow-badge);border:1px solid;flex:none}
.badge svg{width:9px;height:9px}
.b-vet{background:linear-gradient(180deg,var(--badge-vet-top),var(--badge-vet-bottom));color:var(--badge-vet-ink);border-color:var(--badge-vet-line)}
.b-sym{background:linear-gradient(180deg,var(--badge-sym-top),var(--badge-sym-bottom));color:var(--badge-sym-ink);border-color:var(--badge-sym-line)}
.b-photo{background:linear-gradient(180deg,var(--badge-photo-top),var(--badge-photo-bottom));color:var(--badge-photo-ink);border-color:var(--badge-photo-line)}
.b-front{background:linear-gradient(180deg,var(--badge-front-top),var(--badge-front-bottom));color:var(--badge-front-ink);border-color:var(--badge-front-line)}
.b-worm{background:linear-gradient(180deg,var(--badge-worm-top),var(--badge-worm-bottom));color:var(--badge-worm-ink);border-color:var(--badge-worm-line)}
.plain-ic{width:18px;height:18px;flex:none;display:inline-flex;align-items:center;justify-content:center;color:var(--ink-2)}

/* DoseMark */
.markbox{width:18px;height:18px;flex:none;display:inline-flex;align-items:center;justify-content:center}
.mark{display:inline-block;flex:none;border-radius:var(--radius-full);border:1.25px solid color-mix(in srgb,var(--mark) 80%,var(--ink));background:var(--mark)}
.mark.food{width:16px;height:16px}.mark.med{width:11px;height:11px}
.mark.skipped{background:var(--surface);border-width:1.5px}
.mark.partial{background:linear-gradient(to top,var(--mark) 50%,var(--surface) 50%)}
/* PROPOSED DoseMark state "planned": in the usual day, not logged yet. Day view and Usual day only, never on the timeline. */
.mark.planned{background:var(--surface);border:1.5px dashed var(--ink-3)}

/* R10 day-parts card */
.parts{overflow:hidden}
.part{display:flex;align-items:flex-start;gap:10px;padding:8px 4px 8px 12px;border-bottom:1px solid var(--line)}
.part:last-child{border-bottom:0}
.part.meal{background:var(--meal-column)}
.pico{flex:none;width:26px;height:26px;display:flex;align-items:center;justify-content:center;margin-top:9px;color:var(--ink-2)}
.pdot{width:6px;height:6px;border-radius:var(--radius-full);background:var(--line-strong)}
.pdot.on{background:var(--ink-3)}
.pmain{flex:1;min-width:0;padding-top:4px}
.pname{line-height:18px}
.pname .t{font-weight:500;letter-spacing:0;text-transform:none;color:var(--ink-3)}
.irow{display:flex;align-items:center;gap:6px;min-height:44px;margin-right:-4px}
.iopen{flex:1;min-width:0;display:flex;align-items:center;gap:9px;min-height:44px;border:0;background:transparent;padding:0;text-align:left;border-radius:var(--radius-md)}
.iopen:active{opacity:.6}
.iname{font-size:14px;font-weight:600;line-height:18px;letter-spacing:-0.005em}
.iname .d{font-weight:400;color:var(--ink-3)}
.iname.skip{text-decoration:line-through}
.isub{display:block;font-size:12px;line-height:15px;color:var(--ink-3);font-weight:400;text-decoration:none}
.irow.planned .iname{color:var(--ink-2)}
.tag{flex:none;font-size:11px;font-weight:700;padding:1px 7px;border-radius:var(--radius-sm);border:1px solid}
.tag.skipped{background:var(--badge-sym-top);color:var(--badge-sym-ink);border-color:var(--badge-sym-line)}
.tag.partial{background:var(--badge-worm-top);color:var(--badge-worm-ink);border-color:var(--badge-worm-line)}
.give{flex:none;height:28px;padding:0 10px 0 8px;border-radius:var(--radius-md);font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px}
.give::after{top:-8px;bottom:-8px}
.pempty{font-size:13px;color:var(--ink-3);min-height:22px}
.padd{flex:none;width:44px;height:44px;border:0;border-radius:var(--radius-md);background:transparent;padding:0;display:flex;align-items:center;justify-content:center}
.padd span{width:26px;height:26px;border-radius:var(--radius-md);border:1px solid var(--mint-line);background:var(--mint-bg);display:inline-flex;align-items:center;justify-content:center;color:var(--mint-deep)}
.padd:active{opacity:.55}

/* Fill banner (new, R10 "no data" card pattern) */
.fill{display:flex;gap:12px;align-items:flex-start;padding:14px;margin-top:12px;background:var(--mint-bg);border-color:var(--mint-line);box-shadow:none}
.fill .ic{flex:none;width:30px;height:30px;border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--mint-line);display:inline-flex;align-items:center;justify-content:center;color:var(--mint-deep)}
.fill .tx{flex:1;min-width:0}
.fill .h{font-size:14px;font-weight:600;line-height:20px}
.fill .s{font-size:13px;line-height:18px;color:var(--ink-2);margin-top:2px}
.fill .pri{margin-top:10px;width:100%;min-height:44px;border-radius:var(--radius-md);font-size:14px;font-weight:600;padding:0 12px}
.hint{font-size:13px;line-height:18px;color:var(--ink-3);margin:12px 4px 0}

/* R10 navbar */
.nav{display:flex;border-top:1px solid var(--line);background:linear-gradient(180deg,var(--surface),var(--surface-tint));box-shadow:var(--shadow-bar-bottom);padding:6px 8px 14px;flex:none;position:relative;z-index:7}
.nav .ind{position:absolute;top:-1px;left:8px;width:calc((100% - 16px)/5);display:flex;justify-content:center;pointer-events:none}
.nav .ind span{width:28px;height:2px;background:var(--mint)}
.nav .it{flex:1;min-width:0;min-height:48px;border:0;border-radius:var(--radius-md);background:transparent;color:var(--ink-2);font-size:11px;font-weight:500;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.nav .it.on{color:var(--mint-deep);font-weight:700}
.nav .addw{flex:1;min-width:0;display:flex;align-items:center;justify-content:center}
.nav .add{width:100%;max-width:68px;height:40px;border-radius:var(--radius-lg);font-size:13px;font-weight:700;padding:0;white-space:nowrap}

/* stand-in timeline list */
.thead{display:flex;align-items:center;gap:8px;padding:8px 12px 4px 16px;flex:none;background:var(--surface)}
.logo{width:30px;height:30px;flex:none;border-radius:var(--radius-md);background:var(--mint);display:inline-flex;align-items:center;justify-content:center;color:var(--on-mint)}
.list{flex:1;min-height:0;overflow-y:auto;background:var(--surface);border-top:1px solid var(--line)}
.drow{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:4px 16px;text-align:left;font-size:13px}
.drow:active{background:var(--mint-bg)}
.drow .d{width:40px;flex:none;text-align:center;line-height:14px}
.drow .d b{display:block;font-size:15px;line-height:18px}
.dot{width:8px;height:8px;border-radius:var(--radius-full);display:inline-block;margin-right:6px;background:var(--mint)}
.dot.half{background:var(--surface);border:1.5px solid var(--mint-deep)}
.dot.none{background:var(--surface);border:1.5px dashed var(--ink-3)}

/* R10 sheet */
#sheetRoot{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;justify-content:flex-end}
#sheetRoot.open{display:flex}
.scrim{flex:1;border:0;padding:0;border-radius:0;background:color-mix(in srgb,var(--ink) 26%,transparent);cursor:default;animation:fade .18s ease-out both}
.sheet{background:var(--surface);border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;max-height:640px;display:flex;flex-direction:column;box-shadow:var(--shadow-sheet);animation:rise .22s var(--ease) both}
.grab{flex:none;display:flex;justify-content:center;padding:8px 0 0}
.grab span{width:38px;height:4px;border-radius:2px;background:var(--line-strong)}
.shead{flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 8px 8px 20px;border-bottom:1px solid var(--line)}
.stitle{font-family:var(--font-display);font-size:20px;font-weight:600;letter-spacing:-0.03em}
.close{min-height:44px;padding:0 12px;border:0;border-radius:var(--radius-md);background:transparent;font-size:14px;font-weight:600;color:var(--mint-deep)}
.sbody{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 20px}
.sfoot{flex:none;display:flex;gap:8px;padding:12px 16px 26px;border-top:1px solid var(--line);background:var(--surface)}
.sfoot button{min-height:50px;border-radius:var(--radius-md);font-size:16px;font-weight:600}
.sfoot .pri{flex:1}
.sfoot .ghost{padding:0 18px}
.danger{color:var(--danger)}
.dateline{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:500;color:var(--ink-3);margin:-4px 0 8px;min-height:32px}
.dateline .chg{border:0;background:none;padding:0 4px;min-height:44px;margin:-6px -4px;font-size:13px;font-weight:600;color:var(--mint-deep)}
.lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;font-weight:600;color:var(--ink-2);margin:0 0 7px}
.lbl .o{font-weight:500;color:var(--ink-3)}
.fld{margin-bottom:16px}
.inp{display:block;width:100%;min-height:50px;border:1px solid var(--line-strong);border-radius:var(--radius-md);padding:0 14px;font-size:16px;font-weight:400;background:var(--surface-tint);outline:none;transition:border-color .15s,box-shadow .15s}
textarea.inp{padding:13px 14px;line-height:22px;resize:none;min-height:74px}
.inp:focus{border-color:var(--mint);box-shadow:0 0 0 3px color-mix(in srgb,var(--mint) 22%,transparent)}
.inp.short{width:120px;display:inline-block}
.err{color:var(--danger);font-size:12px;line-height:15px;margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* Chip (filter chip, R10) used as single select */
.chips{display:flex;flex-wrap:wrap;gap:10px 8px}
.chip{position:relative;height:36px;display:inline-flex;align-items:center;gap:7px;padding:0 12px 0 10px;border-radius:var(--radius-md);border:1px solid var(--line-strong);background:linear-gradient(180deg,var(--surface),var(--surface-tint));box-shadow:var(--shadow-button);font-size:14px;font-weight:600;color:var(--ink)}
.chip.nomark{padding:0 12px}
.chip::after{content:"";position:absolute;left:0;right:0;top:-4px;bottom:-4px}
.chip[aria-checked="true"],.chip[aria-pressed="true"]{background:var(--mint-bg);border-color:var(--mint-line);color:var(--mint-deep);box-shadow:none}
.chip:active{opacity:.6}
.chip.amt{min-width:44px;justify-content:center;padding:0 10px;font-variant-numeric:tabular-nums}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;line-height:19px;cursor:pointer;margin:-4px 0 12px}
.check input{width:20px;height:20px;accent-color:var(--mint-deep);flex:none;margin:0}
/* R10 add grid */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{min-height:54px;border-radius:var(--radius-md);font-size:14px;font-weight:600;padding:0 12px;display:flex;align-items:center;gap:10px;text-align:left}
.opt .ic{flex:none;width:26px;height:26px;border-radius:7px;background:var(--mint-bg);border:1px solid var(--mint-line);display:inline-flex;align-items:center;justify-content:center;color:var(--mint-deep)}
.opt .tx{flex:1;min-width:0;line-height:17px}
.linkrow{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:48px;margin-top:12px;border:1px dashed var(--line-strong);border-radius:var(--radius-lg);background:var(--surface);font-size:14px;font-weight:600;color:var(--mint-deep)}
.sketch{font-size:11px;font-weight:700;padding:1px 6px;border-radius:var(--radius-sm);border:1px solid var(--line-strong);color:var(--ink-2)}
.summary{padding:12px 14px;margin-top:4px}

/* Toast (PROPOSED) */
#toastRoot{position:absolute;left:12px;right:12px;bottom:76px;z-index:30}
.toast{display:flex;align-items:center;gap:8px;padding:0 4px 0 16px;min-height:48px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow-sheet);animation:pop .15s ease-out both}
.toast .m{flex:1;min-width:0;font-size:14px;font-weight:600}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{transform:translateY(100%)}to{transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes flash{from{background:var(--mint-bg)}to{background:transparent}}
.flash{animation:flash .9s ease-out both;border-radius:var(--radius-md)}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}
</style>
</head>
<body>
<div class="page">
  <aside class="flows" aria-label="Prototype flows">
    <div class="card">
      <div class="disp" style="font-size:15px;font-weight:600">Logging: flows (round 2)</div>
      <p style="margin:6px 0 0;font-size:12px;line-height:16px" class="ink2">JCB-25. Fictional data. Today is Thu 15 Oct 2026, the prototype clock says 16:30. Changes reset on reload.</p>
      <button class="ghost" data-act="flow" data-flow="day">1. Day view (today)</button>
      <button class="ghost" data-act="flow" data-flow="add">2. + Add: the one way in</button>
      <button class="ghost" data-act="flow" data-flow="food">3. Log food (structured)</button>
      <button class="ghost" data-act="flow" data-flow="med">4. Log medication</button>
      <button class="ghost" data-act="flow" data-flow="edit">5. Edit or delete (14 Oct)</button>
      <button class="ghost" data-act="flow" data-flow="sym">6. Symptom: Poo</button>

    undoSnap = snapshot(); const f = st.f; const s = SCHED.find((x) => x.id === f.id);
    if (s.from >= f.from) SCHED = SCHED.filter((x) => x.id !== s.id); else s.to = shift(f.from, -1);
    closeSheet(); st.keep = true; render(); toast(tr('toastUsual'), true);
  },
  save() { SAVE[st.f.kind](st.f); },
  deleteEntry() { undoSnap = snapshot(); ENTRIES = ENTRIES.filter((x) => x.id !== st.f.id); closeSheet(); st.keep = true; render(); toast(tr('toastDeleted'), true); },
  deleteEvent() { undoSnap = snapshot(); EVENTS = EVENTS.filter((x) => x.id !== st.f.id); closeSheet(); st.keep = true; render(); toast(tr('toastEventDeleted'), true); },
  openRange() { st.f = { kind: 'range', from: '2026-08-25', to: '2026-08-31' }; updateSheet(); },
  fillRange() { undoSnap = snapshot(); let n = 0; const f = st.f; for (let d = f.from; d <= f.to; d = shift(d, 1)) n += logSlots(d, dueOpen(d)).length; closeSheet(); st.screen = 'list'; render(); toast(tr('toastFilled', { n }), true); },
  flow(el) {
    closeSheet(); clearToast(); st.flash = null; const k = el.dataset.flow;
    st.screen = 'day'; st.date = TODAY;
    if (k === 'edit' || k === 'sym') st.date = '2026-10-14';
    if (k === 'empty') st.date = '2026-08-31';
    if (k === 'usual') st.screen = 'usual';
    if (k === 'range') st.screen = 'list';
    render();
    if (k === 'add') A.openAdd();
    if (k === 'food' || k === 'med') { A.openAdd(); A.pickKind({ dataset: { type: k } }); }
    if (k === 'sym') { A.openAdd(); A.pickKind({ dataset: { type: 'symptom' } }); A.pickSym({ dataset: { v: 'sx_poo' } }); }
    if (k === 'range') { A.openAdd(); A.openRange(); }
  }
};
function firstOpenPart(d, kind) { for (let p = 1; p <= 7; p++) { if (openSlots(d, p).some((s) => (kind === 'food') === isFood(s.item))) return p; } return kind === 'food' ? 4 : 1; }
function refreshUsual() { const b = document.getElementById('usualBox'); if (b && st.f) b.innerHTML = usualBox(st.f); }

const SAVE = {
  food: saveEntry, med: saveEntry,
  symptom(f) { const title = f.title === '_other' ? f.titleText.trim() : f.title; if (!title) { f.err = true; updateSheet(); return; } saveEvent(f, { type: 'symptom', title, props: f.props }); },
  vet(f) { if (!f.titleText.trim() && !f.detail.trim()) { f.err = true; updateSheet(); return; } saveEvent(f, { type: 'vet', title: f.titleText.trim(), also: f.also }); },
  note(f) { if (!f.detail.trim()) { f.err = true; updateSheet(); return; } saveEvent(f, { type: 'note', title: '' }); },
  other(f) { if (f.type === 'other' && !f.titleText.trim()) { f.err = true; updateSheet(); return; } saveEvent(f, { type: f.type, title: f.type === 'other' ? f.titleText.trim() : '' }); },
  slot(f) {
    if (!f.item || (f.item === '_other' && !(f.otherName || '').trim())) return;
    if (!f.amount) { f.err = 'amount'; updateSheet(); return; }
    undoSnap = snapshot();
    const item = ensureItem(f, isFood(f.item) ? 'food' : 'med');
    const n = setUsualFrom(f.part, item, f.flavour, f.amount, f.unit, f.from, f.len === 'none' ? null : f.to);
    st.flash = [n.id]; closeSheet(); st.keep = true; render(); toast(tr('toastUsual'), true);
  }
};
function ensureItem(f, kind) {
  if (f.item !== '_other') return f.item;
  const name = f.otherName.trim(); const key = name.toLowerCase().replace(/[^a-z0-9]+/g, '-') || 'other';
  if (!ITEMS[key]) { ITEMS[key] = { kind, c: 'mark-neutral', n: [name, name], unit: f.unit, flav: [] }; ORDER.push(key); }
  return key;
}
function saveEntry(f) {
  if (!f.item || (f.item === '_other' && !f.otherName.trim())) { f.err = 'item'; updateSheet(); return; }
  if (!f.amount) { f.err = 'amount'; updateSheet(); return; }
  undoSnap = snapshot();
  const item = ensureItem(f, f.kind);
  let slotId = f.slot;
  if (f.toUsual) { const n = setUsualFrom(f.part, item, f.flavour, f.amount, f.unit, f.date); slotId = n.id; }
  const data = { date: f.date, part: f.part, item, flavour: f.flavour, amount: f.amount, unit: f.unit, state: f.state, note: f.note.trim(), slot: slotId };
  let id;
  if (f.mode === 'edit') { Object.assign(ENTRIES.find((x) => x.id === f.id), data); id = f.id; }
  else { const e = Object.assign({ id: nid('e') }, data); ENTRIES.push(e); id = e.id; }
  st.flash = [id]; st.date = f.date; st.screen = 'day'; closeSheet(); st.keep = true; render(); toast(tr(f.toUsual ? 'toastUsual' : 'toastSaved'), f.toUsual);
}
function saveEvent(f, data) {
  undoSnap = snapshot();
  const d = Object.assign({ date: f.date, detail: (f.detail || '').trim(), props: {}, also: [] }, data);
  if (f.mode === 'edit') Object.assign(EVENTS.find((x) => x.id === f.id), d); else EVENTS.push(Object.assign({ id: nid('v') }, d));
  st.date = f.date; st.screen = 'day'; closeSheet(); st.keep = f.mode === 'edit'; render(); toast(tr('toastSaved'), true);
}

/* events: clicks run actions; typing updates state in place without redrawing the sheet */
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (!fn) return; ev.preventDefault(); fn(el);
});
document.addEventListener('input', (ev) => {
  const el = ev.target; const k = el.dataset && el.dataset.in; const f = st.f; if (!k || !f) return;
  if (k === 'toUsual') { f.toUsual = el.checked; return; }
  if (k === 'amountNum') { const v = parseFloat(el.value.replace(',', '.')); f.amount = isNaN(v) ? null : v; f.err = null; refreshUsual(); return; }
  if (['note', 'detail', 'otherName'].includes(k)) { f[k] = el.value; return; }
  if (k === 'titleText') { f.titleText = el.value; f.err = null; const c = document.getElementById('clinicChips'); if (c) { const clinics = []; EVENTS.forEach((e) => { if (e.type === 'vet' && e.title && !clinics.includes(e.title)) clinics.push(e.title); }); c.innerHTML = clinicChips(f, clinics); } return; }
});
document.addEventListener('change', (ev) => {
  const el = ev.target; const k = el.dataset && el.dataset.in; const f = st.f; if (!k || !f || !el.value) return;
  if (k === 'date') { if (el.value <= TODAY) { f.date = el.value; if (f.mode !== 'edit' && f.item && f.item !== '_other') setItem(f, f.item); refreshUsual(); } return; }
  if (k === 'part') { f.part = +el.value; if (f.mode !== 'edit' && f.item && f.item !== '_other') { setItem(f, f.item); updateSheet(); } else refreshUsual(); return; }
  if (k === 'from') { f.from = el.value; if (f.len === '7' || f.len === '14') f.to = shift(f.from, +f.len - 1); return; }
  if (k === 'to') { f.to = el.value; return; }
  if (k === 'rfrom' || k === 'rto') { f[k === 'rfrom' ? 'from' : 'to'] = el.value; updateSheet(); }
});
document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && st.f) closeSheet(); });

/* deep links for screenshots: #frame=1&lang=pl&screen=day|usual|list&date=…&open=… */
function applyHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('frame')) document.body.classList.add('frame');
  if (h.get('lang')) st.lang = h.get('lang');
  if (h.get('screen')) st.screen = h.get('screen');
  if (h.get('date')) st.date = h.get('date');
  render();
  const o = (h.get('open') || '').split(':');
  if (o[0] === 'add') A.openAdd(o[1] ? { dataset: { part: o[1] } } : null);
  if (o[0] === 'kind') { A.openAdd(); A.pickKind({ dataset: { type: o[1] } }); if (o[2]) A.pickItem({ dataset: { v: o[2] } }); if (o[3]) A.pickSym({ dataset: { v: o[3] } }); }
  if (o[0] === 'edit') { const e = ENTRIES.find((x) => x.date === st.date && x.part === +o[1] && x.item === o[2]); if (e) A.editEntry({ dataset: { id: e.id } }); }
  if (o[0] === 'editEvent') { const e = EVENTS.filter((x) => x.date === st.date)[+o[1]]; if (e) A.editEvent({ dataset: { id: e.id } }); }
  if (o[0] === 'slot') { const s = slotsFor(st.date, +o[1]).find((x) => x.item === o[2]); if (s) A.editSlot({ dataset: { slot: s.id } }); }
  if (o[0] === 'newSlot') A.newSlot({ dataset: { part: o[1] } });
  if (o[0] === 'range') { A.openAdd(); A.openRange(); }
  if (o[0] === 'fill') A.fillDay();
  if (h.get('ctx') && st.f) A.openCtx();
  if (h.get('amt') && st.f) { st.f.amount = +h.get('amt'); st.f.amtOther = h.get('amt').length > 4; updateSheet(); }
  if (h.get('state') && st.f) { st.f.state = h.get('state'); updateSheet(); }
  if (h.get('props') && st.f) { h.get('props').split(',').forEach((kv) => { const p = kv.split('='); st.f.props[p[0]] = p[1]; }); updateSheet(); }
  if (h.get('len') && st.f) A.pickLen({ dataset: { v: h.get('len') } });
  if (h.get('scroll')) { const b = document.querySelector('.body,.list'); if (b) b.scrollTop = +h.get('scroll'); }
  if (h.get('sscroll')) { const b = document.getElementById('sBody'); if (b) b.scrollTop = +h.get('sscroll'); }
}
applyHash();
})();
</script>
