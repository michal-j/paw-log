}
.menu-row__text { flex: 1; min-width: 0; }
.menu-row svg { color: var(--color-mint-deep); }
.menu-times { display: grid; gap: var(--space-2); margin: 0; padding: 0; list-style: none; }
.menu-time { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); min-height: 50px; }
.menu-time label { flex: 1; min-width: 0; font: 500 14px / 18px var(--type-body-family); }
.menu-time .input { width: 120px; flex: none; }

/* ---------- + Add options ---------- */
.add-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-2); }
.add-opt { justify-content: flex-start; gap: 10px; min-height: 54px; padding: 0 var(--space-3); font-size: var(--type-body-size); text-align: left; white-space: normal; }
.add-opt__icon {
  flex: none;
  width: 26px;
  height: 26px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--color-mint-line);
  border-radius: var(--radius-md);
  background: var(--color-mint-bg);
  color: var(--color-mint-deep);
}
.add-opt__text { flex: 1; min-width: 0; line-height: 17px; }
.dateline--item { margin-bottom: var(--space-3); }
.dateline__item { display: flex; align-items: center; gap: var(--space-2); color: var(--color-ink); font: 600 15px / 20px var(--type-body-family); }
.menu-end { margin-top: var(--space-2); }
.menu-end__btn { width: 100%; }

/* ---------- Status (load failed, crashed) ---------- */
.app-status { margin: var(--space-6) var(--space-4); text-align: center; }
.app-status__text { margin: 0 0 var(--space-3); color: var(--color-ink-2); }

@keyframes pl-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes pl-rise { from { transform: translateY(100%); } to { transform: none; } }
@keyframes pl-pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* DoseMark and EventBadge (docs/design-system/components). One style set for every screen. */

/* ---------- Circles (DoseMark) ---------- */
.dose-mark {
  --ring: color-mix(in srgb, var(--mark) 80%, var(--color-ink));
  flex: none;
  box-sizing: border-box;
  border-radius: var(--radius-full);
  border: 1.5px solid var(--ring);
  background: var(--mark);
}
.dose-mark--food { width: 16px; height: 16px; }
.dose-mark--small { width: 11px; height: 11px; }
.dose-mark--skipped { background: var(--color-surface); }
.dose-mark--partial { background: linear-gradient(0deg, var(--mark) 50%, var(--color-surface) 50%); }
/* In the usual day, not logged yet: a dashed ink-3 ring. Day view and Usual day only, never on the Timeline. */
.dose-mark--planned { background: var(--color-surface); border-style: dashed; border-color: var(--color-ink-3); }

/* ---------- Event badges (EventBadge) ---------- */
.event-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
  height: 18px;
  min-width: 18px;
  box-sizing: border-box;
  padding: 0 var(--space-1);
  border-radius: var(--radius-sm);
  font: var(--type-badge-weight) var(--type-badge-size) / var(--type-badge-line) var(--type-badge-family);
  box-shadow: var(--shadow-badge);
  white-space: nowrap;
}
.event-badge--mini { height: 13px; min-width: 13px; padding: 0 2px; border-radius: var(--radius-xs); font-size: 9px; line-height: 11px; gap: 1px; }
.event-badge__glyph { width: 10px; height: 10px; flex: none; }
.event-badge__glyph--lg, .event-badge__glyph--photo { width: 12px; height: 12px; }
.event-badge--mini .event-badge__glyph { width: 8px; height: 8px; }
.event-badge--mini .event-badge__glyph--lg, .event-badge--mini .event-badge__glyph--photo { width: 9px; height: 9px; }
.event-badge--vet { background: linear-gradient(180deg, var(--color-badge-vet-top), var(--color-badge-vet-bottom)); color: var(--color-badge-vet-ink); border: 1px solid var(--color-badge-vet-line); }
.event-badge--sym { background: linear-gradient(180deg, var(--color-badge-sym-top), var(--color-badge-sym-bottom)); color: var(--color-badge-sym-ink); border: 1px solid var(--color-badge-sym-line); }
.event-badge--note { background: linear-gradient(180deg, var(--color-badge-note-top), var(--color-badge-note-bottom)); color: var(--color-badge-note-ink); border: 1px solid var(--color-badge-note-line); }
/* "+N": the badges that did not fit on a busy day (neutral, from existing tokens). */
.event-badge--more { background: var(--color-surface-tint); color: var(--color-ink-2); border: 1px solid var(--color-line-strong); box-shadow: none; }
.event-badge--photo { background: linear-gradient(180deg, var(--color-badge-photo-top), var(--color-badge-photo-bottom)); color: var(--color-badge-photo-ink); border: 1px solid var(--color-badge-photo-line); }
.event-badge--front { background: linear-gradient(180deg, var(--color-badge-front-top), var(--color-badge-front-bottom)); color: var(--color-badge-front-ink); border: 1px solid var(--color-badge-front-line); }
.event-badge--worm { background: linear-gradient(180deg, var(--color-badge-worm-top), var(--color-badge-worm-bottom)); color: var(--color-badge-worm-ink); border: 1px solid var(--color-badge-worm-line); }

/* List screens (Pinned, Tracked): the Usual day header with a title row and a "New" button. */
.list { display: flex; flex-direction: column; flex: 1; min-height: 0; background: var(--color-ground); }
.list .usual__head { padding-top: var(--space-4); }
.list__titlerow { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
.list__titlerow .usual__title { min-width: 0; overflow-wrap: anywhere; }
.list__new { flex: none; }
.list__new .btn__icon { color: var(--color-mint-deep); }
.list .day__body { padding-bottom: var(--space-6); }
.list .day__body > .day-empty:first-child { margin-top: var(--space-4); }

/* Day view (slice 3a), after the R10 prototype "Day view". Colours, radii and shadows come only from tokens.css. */

.day { display: flex; flex-direction: column; flex: 1; min-height: 0; background: var(--color-ground); }

/* ---------- Ghost buttons (design-system Button, ghost) ---------- */
.day-btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 34px;
  margin: 0;
  border: 1px solid var(--color-line-strong);
  border-radius: var(--radius-md);
  background: linear-gradient(180deg, var(--color-surface), var(--color-surface-tint));
  box-shadow: var(--shadow-button);
  color: var(--color-ink);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
/* Hit area: at least 44px in both directions. */
.day-btn::after {
  content: '';
  position: absolute;
  left: 50%;
  top: 50%;
  width: max(100%, 44px);
  height: 44px;
  transform: translate(-50%, -50%);
}
.day-btn:active { opacity: 0.55; }
.day-btn--back {
  gap: var(--space-1);
  white-space: nowrap;
  padding: 0 var(--space-4) 0 10px;
  font: var(--type-button-weight) var(--type-button-size) / var(--type-button-line) var(--type-button-family);
}
.day-btn--back svg { color: var(--color-mint-deep); }
.day-btn--step { flex: none; width: 36px; height: 36px; padding: 0; }
.day-btn[aria-disabled='true'] { opacity: 0.35; cursor: default; box-shadow: none; }
.day-btn[aria-disabled='true']:active { opacity: 0.35; }

/* ---------- Header ---------- */
.day__top { flex: none; display: flex; align-items: center; padding: 10px var(--space-3) 0; }
.day__head { flex: none; display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-3) var(--space-3); }
.day__titles { flex: 1; min-width: 0; text-align: center; }
.day__title {
  margin: 0;
  font: var(--type-title-weight) var(--type-title-size) / var(--type-title-line) var(--type-title-family);
  letter-spacing: var(--type-title-tracking);
  font-weight: var(--type-heading-weight);
}
.day__sub {
  margin: 1px 0 0;
  color: var(--color-mint-deep);
  font: var(--type-caption-weight) var(--type-caption-size) / var(--type-caption-line) var(--type-caption-family);
  letter-spacing: var(--type-caption-tracking);
  text-transform: uppercase;
}

/* ---------- Scrolling body ---------- */
.day__body {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  /* No safe-area inset here: the nav bar below already sits on the home indicator. */
  padding: 0 var(--space-3) 20px;
  border-top: 1px solid var(--color-line);
}
.day__caption {
  margin: 18px var(--space-1) var(--space-2);
  color: var(--color-ink-2);
  font: var(--type-caption-weight) var(--type-caption-size) / var(--type-caption-line) var(--type-caption-family);
  letter-spacing: var(--type-caption-tracking);
  text-transform: uppercase;
}

/* ---------- Cards (design-system Card) ---------- */
.day-card {
  margin: 0 0 var(--space-2);
  padding: 13px;
  border: 1px solid var(--color-line);
  border-radius: var(--radius-lg);
  background: linear-gradient(180deg, var(--color-surface), var(--color-surface-tint));
  box-shadow: var(--shadow-card);
}
.day-card__head {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 0;
  font: var(--type-heading-weight) var(--type-heading-size) / var(--type-heading-line) var(--type-heading-family);
  letter-spacing: var(--type-heading-tracking);
  overflow-wrap: anywhere;
}
.day-card__head .event-badge { flex: none; }
.day-card__text { margin: 6px 0 0; color: var(--color-ink-2); font: var(--type-body-weight) var(--type-body-size) / var(--type-body-line) var(--type-body-family); }
.day-card__rows { margin: 0; }
.day-card__rows { margin: var(--space-1) 0 0; padding: 0; list-style: none; }
.day-card__rows li + li { border-top: 1px solid var(--color-line); }
.day-card__row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--space-3);
  width: 100%;
  min-height: 44px;
  margin: 0;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--color-ink);
  font: var(--type-body-weight) var(--type-body-size) / var(--type-body-line) var(--type-body-family);
  text-align: left;
  cursor: pointer;
}
.day-card__row:active { opacity: 0.6; }
/* A symptom with a description: name and attributes on line 1, the description full width below. */
.day-card__row--desc { flex-wrap: wrap; row-gap: var(--space-1); padding-block: var(--space-2); }
.day-card__row-desc { flex: 0 0 100%; min-width: 0; color: var(--color-ink-2); white-space: pre-line; overflow-wrap: anywhere; }
.day-card__row-label { font: var(--type-body-strong-weight) var(--type-body-strong-size) / var(--type-body-strong-line) var(--type-body-strong-family); }
.day-card__row-value { min-width: 0; text-align: right; color: var(--color-ink-2); overflow-wrap: anywhere; }
/* A card that opens its event: a full-width button with the Card look. */
.day-card--tap { display: block; width: 100%; color: var(--color-ink); font: inherit; text-align: left; cursor: pointer; }
.day-card--tap:active { opacity: 0.6; }
.day-card--tap .day-card__text { display: block; }
.day-card__glyph { flex: none; width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; color: var(--color-ink-2); }
.day-card__chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.day-card__chip {
  padding: 3px 9px;
  border: 1px solid var(--color-mint-line);
  border-radius: var(--radius-sm);
  background: var(--color-mint-bg);
  color: var(--color-mint-deep);
  font: 600 12px / 16px var(--type-body-family);
}

/* ---------- Empty day ---------- */
.day-empty { display: flex; gap: var(--space-3); align-items: flex-start; padding: 14px; background: var(--color-surface-tint); }
.day-empty__icon {
  flex: none;
  width: 30px;
  height: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--color-mint-line);
  border-radius: var(--radius-lg);
  background: var(--color-mint-bg);
  color: var(--color-mint-deep);
}
.day-empty__text { margin: 0; color: var(--color-ink-2); }

/* ---------- Fill banner (the "no data" card pattern) ---------- */
.day-fill { display: flex; gap: var(--space-3); align-items: flex-start; margin-top: var(--space-3); padding: 14px; border-color: var(--color-mint-line); background: var(--color-mint-bg); box-shadow: none; }
.day-fill__icon {
  flex: none;
  width: 30px;
  height: 30px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--color-mint-line);
  border-radius: var(--radius-lg);
  background: var(--color-surface);
  color: var(--color-mint-deep);
}
.day-fill__text { flex: 1; min-width: 0; }
.day-fill__head { margin: 0; font: 600 14px / 20px var(--type-body-family); }
.day-fill__hint { margin: 2px 0 0; color: var(--color-ink-2); font: var(--type-body-weight) 13px / 18px var(--type-body-family); }
.day-fill__btn { width: 100%; margin-top: 10px; white-space: normal; }

/* Fill on a day that already has entries: a quiet action under the day parts, away from the rows. */
.day-fill-quiet { margin: var(--space-4) 0 var(--space-2); text-align: center; }
.day-fill-quiet__text { margin: 0 0 var(--space-2); color: var(--color-ink-3); font: var(--type-small-weight) var(--type-small-size) / var(--type-small-line) var(--type-small-family); }
.day-fill-quiet__btn { white-space: normal; }

/* ---------- Usual-day items removed for this day: one quiet line, never item rows (JCB-60) ---------- */
.day-removed {
  margin: var(--space-2) 0 0;
  scroll-margin-bottom: calc(48px + var(--space-4)); /* clear of the floating toast */
  text-align: center;
  color: var(--color-ink-3);
  font: var(--type-small-weight) var(--type-small-size) / var(--type-small-line) var(--type-small-family);
}
.day-removed__btn {
  min-height: 44px;
  padding: 0 var(--space-1);
  border: 0;
  background: transparent;
  color: var(--color-mint-deep);
  font: inherit;
  font-weight: var(--type-button-weight);
  cursor: pointer;
}
.day-removed__btn:disabled { opacity: 0.5; cursor: default; }

/* ---------- Section caption with the Usual day link ---------- */
.day__section { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
.day__section .day__caption { flex: 1; min-width: 0; }
.day__link {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  min-height: 44px;
  margin: 6px calc(-1 * var(--space-1)) -2px 0;
  padding: 0 var(--space-1);
  border: 0;
  background: transparent;
  color: var(--color-mint-deep);
  font: 600 12px / 16px var(--type-body-family);
  cursor: pointer;
}

/* ---------- Day parts ---------- */
.day-parts { padding: 0; overflow: hidden; list-style: none; }
.day-part {
  padding: var(--space-1) var(--space-1) var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--color-line);
  background: var(--color-surface);
}
.day-part:last-child { border-bottom: 0; }
.day-part--meal { background: linear-gradient(var(--color-meal-column), var(--color-meal-column)), var(--color-surface); }
/* Icon, name and + share one 44px row, so the name is centred on the icon. */
.day-part__head { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.day-part__icon { flex: none; width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; color: var(--color-ink-2); }
.day-part__dot { width: 6px; height: 6px; border-radius: var(--radius-full); background: var(--color-line-strong); }
.day-part__dot--any { background: var(--color-ink-3); }
.day-part__name {
  flex: 1;
  min-width: 0;
  margin: 0;
  color: var(--color-ink-3);
  font: var(--type-caption-weight) var(--type-caption-size) / 16px var(--type-caption-family);
  letter-spacing: var(--type-caption-tracking);
  text-transform: uppercase;
}
.day-part__time { font-weight: var(--type-small-weight); letter-spacing: 0; text-transform: none; }
.day-part__items { margin: 0; padding: 0 0 0 36px; list-style: none; }
.day-part__none { margin: 0 0 0 36px; min-height: 22px; color: var(--color-ink-3); font: var(--type-small-weight) var(--type-small-size) / 22px var(--type-small-family); }

.part-add { flex: none; width: 44px; height: 44px; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: var(--radius-md); background: transparent; cursor: pointer; }
.part-add span {
  width: 26px;
  height: 26px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--color-mint-line);
  border-radius: var(--radius-md);
  background: var(--color-mint-bg);
  color: var(--color-mint-deep);
}
.part-add:active { opacity: 0.55; }

.day-item { display: flex; align-items: center; gap: 6px; min-height: 44px; padding-right: var(--space-1); }
.day-item__open {
  flex: 1;
  min-width: 0;
  min-height: 44px;
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--color-ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.day-item__open:active { opacity: 0.6; }
.day-item__mark { flex: none; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; }
.day-item__text { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.day-item__name { font: var(--type-body-strong-weight) var(--type-body-strong-size) / 18px var(--type-body-strong-family); }
.day-item__dose { color: var(--color-ink-3); }
.day-item__sub { display: block; color: var(--color-ink-3); font: var(--type-body-weight) 12px / 15px var(--type-body-family); }
.day-item--skipped .day-item__name, .day-item--skipped .day-item__dose { text-decoration: line-through; }
.day-item--planned .day-item__name { color: var(--color-ink-2); }
/* Removed for this day: quiet, no Given; tapping it logs the item after all. */
.day-item--all { justify-content: flex-start; }
.day-give { flex: none; height: 28px; padding: 0 10px 0 var(--space-2); font-size: var(--type-button-size); }
.day-tag {
  flex: none;
  padding: 1px 7px;
  border: 1px solid;
  border-radius: var(--radius-sm);
  font: var(--type-badge-weight) var(--type-badge-size) / var(--type-caption-line) var(--type-badge-family);
  font-weight: 700;
}
.day-tag--skipped { background: var(--color-tag-skipped-top); border-color: var(--color-tag-skipped-line); color: var(--color-tag-skipped-ink); }
.day-tag--partial { background: var(--color-badge-worm-top); border-color: var(--color-badge-worm-line); color: var(--color-badge-worm-ink); }

/* ---------- Usual day screen ---------- */
.usual__head { flex: none; padding: var(--space-3) 18px 10px; }
.usual__asof {
  margin: 0;
  color: var(--color-mint-deep);
  font: var(--type-caption-weight) var(--type-caption-size) / var(--type-caption-line) var(--type-caption-family);
  letter-spacing: var(--type-caption-tracking);
  text-transform: uppercase;
}
.usual__title { margin: 2px 0 0; font: 600 28px / 32px var(--type-title-family); letter-spacing: var(--type-title-tracking); }
.usual__hint { margin: 6px 0 0; color: var(--color-ink-3); font: var(--type-body-weight) 13px / 18px var(--type-body-family); }
.usual__parts { margin-top: var(--space-3); }


/* The heading takes focus when the day opens or changes; it is not a control, so no ring. */
.day__title:focus { outline: none; }

/* Tracked conditions (JCB-6), after design/proposals/pinned-tracked. Tokens only. */

/* List screen header: src/components/list.css (shared with Pinned). */
.list__new { white-space: nowrap; }
.list-empty__btn { margin-top: var(--space-3); }

/* ---------- Condition card (Tracked list) ---------- */
.day-card.cond-card { display: flex; align-items: center; gap: var(--space-3); min-height: 64px; }
.cond-card__text { flex: 1; min-width: 0; }
.cond-card__meta { display: block; margin-top: 3px; color: var(--color-ink-3); font: var(--type-small-weight) var(--type-small-size) / var(--type-small-line) var(--type-small-family); }
.cond-card__chev { flex: none; color: var(--color-ink-3); display: inline-flex; }
.cond-card--resolved { background: var(--color-surface-tint); box-shadow: none; }
.cond-card--resolved .day-card__head { color: var(--color-ink-2); }

/* ---------- ConditionTag: a Card chip that opens a tracked condition ---------- */
.cond-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.cond-tags--row { justify-content: flex-end; margin: 0 0 var(--space-2); }
.cond-tag {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  max-width: 100%;
  margin: 0;
  padding: 3px 9px 3px 7px;
  border: 1px solid var(--color-badge-photo-line);
  border-radius: var(--radius-sm);
  background: var(--color-badge-photo-top);
  color: var(--color-badge-photo-ink);
  font: 600 12px / 16px var(--type-body-family);
  text-align: left;
  overflow-wrap: anywhere;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
/* Hit area: 44px tall around the 24px tag. */
.cond-tag::after { content: ''; position: absolute; left: 0; right: 0; top: -10px; bottom: -10px; }
.cond-tag:active { opacity: 0.6; }
.cond-tag svg { flex: none; }
.cond-tag--resolved { border-color: var(--color-line-strong); background: var(--color-surface-tint); color: var(--color-ink-2); }

/* Event card with tags: the head and text open the event; each tag is its own target. */
.ev-card { position: relative; }
/* The open button covers the whole card (at least 44px); the tags sit above it as their own targets. */
.ev-card__open::after { content: ''; position: absolute; inset: 0; border-radius: var(--radius-lg); }
.ev-card .cond-tags { position: relative; z-index: 1; }

/* ---------- Condition page ---------- */
.cond__top { justify-content: space-between; }
.cond__edit { min-height: 44px; padding: 0 var(--space-2); }

/* Condition picker: a long name wraps inside its chip instead of widening the sheet. */
.cond-chips .chip { max-width: 100%; height: auto; min-height: 36px; padding-top: var(--space-2); padding-bottom: var(--space-2); white-space: normal; overflow-wrap: anywhere; text-align: left; }

/* Condition picker in the event forms: the inline "New" row. */
.cond-new-row .input { flex: 1; min-width: 0; }

/* Year groups of the history (JCB-78): a 44px header that folds the year's entries. */
.cond__year { margin-top: var(--space-2); }
.cond__yearhead {

  align-items: center;
  gap: var(--space-2);

/* Photos (JCB-7), after design/proposals/pinned-tracked: PhotoThumb, PhotoStrip, PhotoPick, PhotoViewer

/* A vet visit: the text on the left, its photos in a column on the right, whatever the text length. */
.ev-card__side { display: flex; align-items: flex-start; gap: var(--space-3); }

.strip { display: flex; gap: 10px; margin: 0 calc(-1 * var(--space-3)); padding: 2px var(--space-3) var(--space-2); overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; }
.strip::-webkit-scrollbar { display: none; }
.strip__item { flex: none; display: flex; flex-direction: column; align-items: center; gap: 5px; scroll-snap-align: start; }
.strip-empty { display: flex; align-items: center; gap: var(--space-3); padding-bottom: var(--space-2); }
.strip-empty__text { flex: 1; margin: 0; color: var(--color-ink-3); font: var(--type-small-weight) var(--type-small-size) / var(--type-small-line) var(--type-small-family); }
.strip__date { color: var(--color-ink-2); font: 600 12px / 16px var(--type-body-family); font-variant-numeric: tabular-nums; }

/* ---------- PhotoPick: dashed tile that starts the iPhone photo menu ---------- */
.photo-pick {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  width: 100%;
  min-height: 150px;
  margin: 0;
  padding: var(--space-3);
  border: 1.5px dashed var(--color-line-strong);

  background: var(--color-surface-tint);
  color: var(--color-mint-deep);
  font: 600 15px / 20px var(--type-body-family);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.photo-pick--tile { width: 104px; min-height: 104px; height: 104px; padding: var(--space-1); gap: var(--space-1); font-size: 12px; line-height: 15px; text-align: center; }
.photo-pick--tile .photo-pick__icon { width: 30px; height: 30px; }

/* ---------- PhotoViewer: full screen, light, swipe between photos ---------- */
.viewer { overscroll-behavior: contain; position: absolute; inset: 0; z-index: 25; display: flex; flex-direction: column; background: var(--color-ground); animation: viewer-in 180ms cubic-bezier(0.2, 0.7, 0.2, 1) both; }

.viewer__pos { margin: 0; min-width: 0; overflow-wrap: anywhere; color: var(--color-ink-2); font: var(--type-caption-weight) var(--type-caption-size) / var(--type-caption-line) var(--type-caption-family); letter-spacing: var(--type-caption-tracking); text-transform: uppercase; }
.viewer__stage { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; overflow: hidden; touch-action: none; overscroll-behavior: contain; background: var(--color-ink); }
.viewer__track { display: flex; width: 100%; height: 100%; transition: transform 220ms cubic-bezier(0.2, 0.7, 0.2, 1); }

.viewer__slide img { max-width: 100%; max-height: 100%; will-change: transform; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-user-drag: none; -webkit-touch-callout: none; }
.viewer .viewer__step { position: absolute; top: 50%; margin-top: -18px; z-index: 2; }
.viewer__step--prev { left: var(--space-2); }

.viewer__info { flex: none; padding: var(--space-3) var(--space-4) calc(var(--space-4) + env(safe-area-inset-bottom)); border-top: 1px solid var(--color-line); background: var(--color-surface); }
.viewer__date { margin: 0; font: var(--type-heading-weight) var(--type-heading-size) / var(--type-heading-line) var(--type-heading-family); letter-spacing: var(--type-heading-tracking); }
.viewer__caption { margin: 4px 0 0; color: var(--color-ink-2); white-space: pre-line; overflow-wrap: anywhere; }

/* + Add sheet: the Photo option's icon in the photo badge colours. */

.photo-row--sym { margin: 0 0 var(--space-2); }

/* JCB-83: the photo viewer is dark all over (Compare keeps the light look). Text is surface (white) on ink: 17:1. */
.viewer--dark { background: var(--color-ink); color: var(--color-surface); }
.viewer--dark .viewer__bar { background: var(--color-ink); border-bottom-color: transparent; }
.viewer--dark .viewer__pos, .viewer--dark .sheet__close, .viewer--dark .link-btn, .viewer--dark .viewer__caption { color: var(--color-surface); }
.viewer--dark .viewer__info { background: var(--color-ink); border-top-color: transparent; }

/* ===================== PROPOSED (JCB-76): FileRow, FileList, FileBar. Tokens only. ===================== */
/* FileRow: a stored or picked PDF. Tile (page with "PDF"), name, one meta line, and a trailing glyph. */
.file { position: relative; display: flex; align-items: center; gap: var(--space-2); }
.file-row {
  position: relative;
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: 56px;
  margin: 0;
  padding: var(--space-2) 0;
  border: 0;
  background: transparent;
  color: var(--color-ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.file-row:active { opacity: 0.6; }
.file-tile {
  flex: none;
  position: relative;
  width: 34px;
  height: 42px;
  display: inline-flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 6px;
  border: 1px solid var(--color-line-strong);
  border-radius: var(--radius-sm);
  background: linear-gradient(180deg, var(--color-surface), var(--color-surface-tint));
  box-shadow: var(--shadow-badge);
  color: var(--color-mint-deep);
  font: var(--type-badge-weight) 10px / 12px var(--type-badge-family);
  letter-spacing: 0.02em;

.file-tile::before {
  content: '';
  position: absolute;
  top: -1px;
  right: -1px;
  width: 11px;
  height: 11px;
  border-left: 1px solid var(--color-line-strong);
  border-bottom: 1px solid var(--color-line-strong);
  border-top-right-radius: var(--radius-sm);
  background: linear-gradient(225deg, var(--color-ground) 50%, var(--color-line) 50%);
}
.file-row__text { flex: 1; min-width: 0; }
.file-row__name {

  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
  overflow-wrap: anywhere;
  font: var(--type-body-strong-weight) var(--type-body-strong-size) / var(--type-body-strong-line) var(--type-body-strong-family);

.file-row__go { flex: none; display: inline-flex; color: var(--color-ink-3); }

.file-bar > i { display: block; height: 100%; width: var(--p, 0%); border-radius: var(--radius-full); background: var(--color-mint); transition: width 120ms linear; }

// ---------- Helpers ----------
const t = (k, v) => fill(L[S.lang][k] ?? k, v);
function fill(s, v) { return s.replace(/\{(\w+)\}/g, (_, k) => (v && v[k] != null ? v[k] : '')); }
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const loc = (x) => (x && typeof x === 'object' && !Array.isArray(x) ? x[S.lang] : x);
function plural(n) {
  if (S.lang === 'en') return n === 1 ? 'one' : 'many';
  if (n === 1) return 'one';
  const a = n % 10, b = n % 100;
  return a >= 2 && a <= 4 && !(b >= 12 && b <= 14) ? 'few' : 'many';
}
const pagesText = (n) => t('pages_' + plural(n), { n });
function sizeText(kb) {
  if (kb < 1000) return kb + ' KB';
  return (kb / 1024).toFixed(1).replace('.0', '').replace('.', ',') + ' MB'; // comma, like doses in the reviewed copy
}
const metaText = (d) => (d.pages ? sizeText(d.kb) + ' · ' + pagesText(d.pages) : sizeText(d.kb));
function dmy(iso) { const [, m, d] = iso.split('-'); return +d + ' ' + MONTHS[S.lang][+m - 1]; }
function wdmy(iso) { const dt = new Date(iso + 'T12:00:00'); return DAYS[S.lang][dt.getDay()] + ' ' + dmy(iso); }
const docsOf = (evId) => S.docs.filter((d) => d.ev === evId && !d.removed);
const photosOf = (evId) => PHOTOS.filter((p) => p.ev === evId);

/** FileRow. mode: card (Day view / history), page (condition Documents), form (event form). */
function fileRow(d, mode, act) {
  const name = esc(loc(d.name));
  const label = esc(fill(L[S.lang].docOpenLabel, { name: loc(d.name), size: sizeText(d.kb) }));
  const tile = '<span class="file-tile" aria-hidden="true">PDF</span>';
  if (mode === 'form') return formRow(d, tile, name, act);
  const go = `<span class="file-row__go">${I.out()}</span>`;
  const date = mode === 'page' ? `<span class="file-row__date">${dmy(EVENTS[d.ev].date)}</span>` : '';
  return `<li><div class="file"><button type="button" class="file-row" data-act="open" data-doc="${d.id}" aria-label="${label}">${tile}
    <span class="file-row__text"><span class="file-row__name">${name}</span><span class="file-row__meta">${metaText(d)}</span></span>${date}${go}</button></div></li>`;
}
function formRow(d, tile, name, act = 'docedit') {
  let meta = `<span class="file-row__meta">${metaText(d)}</span>`;
  let retry = '';
  if (d.status === 'uploading') {
    meta = `<span class="file-row__meta" data-pct="${d.id}">${t('docUploading', { p: Math.round(d.p) })}</span><span class="file-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(d.p)}"><i data-bar="${d.id}" style="--p:${d.p}%"></i></span>`;
  } else if (d.status === 'failed') {
    meta = `<span class="file-row__meta file-row__meta--error">${t('docFailed')}</span>`;
    retry = `<button type="button" class="link-btn file__retry" data-act="retry" data-doc="${d.id}">${t('docRetry')}</button>`;
  }
  const busy = d.status === 'uploading';
  return `<li><div class="file"><button type="button" class="file-row" data-act="${act}" data-doc="${d.id}" ${busy ? 'disabled' : ''}>${tile}
    <span class="file-row__text"><span class="file-row__name">${name}</span>${meta}</span><span class="file-row__go">${busy || d.status === 'failed' ? '' : act === 'open' ? I.out() : I.chev('right', 16)}</span></button>${retry}</div></li>`;
}
function fileList(docs, mode, cls = '') {
  if (!docs.length) return '';
  return `<ul class="file-list${cls}">${docs.map((d) => fileRow(d, mode)).join('')}</ul>`;
}
const PH = `data:image/svg+xml;utf8,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cfd6d2"/><stop offset="1" stop-color="#e9edeb"/></linearGradient></defs><rect width="80" height="80" fill="url(#g)"/><circle cx="40" cy="42" r="16" fill="#f6f8f7" opacity=".7"/></svg>')}`;
function thumb(p, size) {
  return `<button type="button" class="photo-thumb ${size === 'sm' ? 'photo-thumb--sm' : size === 'lg' ? 'photo-thumb--lg' : ''}" aria-label="Photo"><img src="${p.src || PH}" alt="" draggable="false"></button>`;
}
function condTags(e) {
  if (!e.conds.length) return '';
  return `<div class="cond-tags">${e.conds.filter((c) => CONDS[c] && !(S.screen === 'cond' && c === S.cond)).map((c) => `<button type="button" class="cond-tag">${I.target()}${esc(loc(CONDS[c].name))}</button>`).join('')}</div>`;

/** EventCard (src/day/EventCard.tsx) with the proposed file list between the photos and the tags. */
function eventCard(e, opts = {}) {
  const photos = photosOf(e.id), docs = docsOf(e.id);
  let content;
  if (e.type === 'vet') {
    content = `<span class="day-card__head">${badge('vet')}${t('visit')} · ${esc(e.title)}</span><span class="day-card__text">${esc(loc(e.detail))}</span>` +
      (e.also ? `<span class="day-card__chips">${e.also[S.lang].map((a) => `<span class="day-card__chip">${esc(a)}</span>`).join('')}</span>` : '');
  } else if (e.type === 'symptom') {
    content = `<span class="day-card__head">${badge('sym')}${esc(loc(e.title))}</span><span class="day-card__text">${esc(loc(e.detail))}</span>`;
  } else if (e.type === 'note') {
    content = `<span class="day-card__head">${badge('note')}${esc(loc(e.title))}</span><span class="day-card__text">${esc(loc(e.detail))}</span>`;
  } else {
    content = `<span class="day-card__head">${badge('photo')}${S.lang === 'en' ? 'Photo' : 'Zdjęcie'}</span><span class="day-card__text">${esc(loc(e.detail))}</span>`;
  }
  const open = `<button type="button" class="ev-card__open" data-act="editEvent" data-ev="${e.id}">${content}</button>`;
  const side = e.type === 'vet' && photos.length;
  const phRow = photos.length ? `<div class="photo-row ${side ? 'photo-row--side' : ''}">${photos.map((p) => thumb(p, opts.small ? 'sm' : 'md')).join('')}</div>` : '';
  const body = side ? `<div class="ev-card__side">${open}${phRow}</div>` : open + phRow;
  return `<div class="day-card ev-card">${body}${fileList(docs, 'card')}${condTags(e)}</div>`;
}

  if (!a.file) {
    main = `<div class="field"><button type="button" class="photo-pick doc-pick" data-act="pick"><span class="photo-pick__icon">${I.doc(22)}</span>${t('docPick')}</button>
      ${a.err ? `<p class="field__error" role="alert">${esc(a.err)}</p>` : `<p class="field__note">${t('docLimitOne')}</p>`}</div>`;
  } else {
    const f = a.file;
    main = `<div class="field"><label class="field__label" for="dn">${t('docName')}</label><input class="input" id="dn" data-bind="addName" value="${esc(a.name)}" ${f.status === 'uploading' ? 'disabled' : ''}></div>
      <div class="field"><label class="field__label">${t('date')}</label><input class="input" value="${wdmy(TODAY)}" readonly></div>
      <ul class="file-list file-list--form">${fileRow({ ...f, name: a.name }, 'form', 'open')}</ul>
      ${a.err ? `<p class="field__error" role="alert">${esc(a.err)}</p>` : `<p class="field__note">${fill(L[S.lang].docLinked, { x: loc(c.name) })}</p>`}`;
  }
  const busy = a.file && a.file.status === 'uploading';
  const foot = `<button type="button" class="btn btn--primary btn--lg" data-act="saveAdd" ${!a.file || busy ? 'disabled' : ''} ${busy ? 'aria-busy="true"' : ''}>${busy ? t('saving') : t('save')}</button>`;
  return sheet(t('docAddTitle'), main, foot);
}
function viewer() {
  const d = findDoc(S.viewer);
  return `<div class="ios" role="dialog" aria-label="${esc(loc(d.name))}"><div class="ios__bar"><button type="button" class="link-btn" data-act="viewerClose">${t('done')}</button>
    <span class="ios__name">${esc(loc(d.name))}.pdf</span><span class="ios__share">${I.share()}</span></div>
    <div class="ios__page" aria-hidden="true"><i class="h"></i><i></i><i></i><i class="s"></i><i></i><i></i><i></i><i class="s"></i><i></i><i></i><i class="s"></i><i></i></div>
    <p class="ios__note">${t('iosNote')}</p></div>`;
}
function toast() {
  if (!S.toast) return '';
  return `<div class="toast-root"><div class="toast" role="status"><span class="toast__text">${esc(S.toast.text)}</span>${S.toast.undo ? `<button type="button" class="link-btn" data-act="undo">${t('undo')}</button>` : ''}</div></div>`;
}
const findDoc = (id) => (S.form && S.form.docs.find((d) => d.id === id)) || (S.addDoc && S.addDoc.file && S.addDoc.file.id === id ? S.addDoc.file : null) || S.docs.find((d) => d.id === id);

// ---------- Render ----------
function render() {
  const phone = document.getElementById('phone');
  const keep = [...phone.querySelectorAll('.sheet__body, .day__body')].map((el) => el.scrollTop);
  const open = S.sheet === 'vet' || S.sheet === 'add' || S.docEdit || S.picker;
  const base = S.screen === 'cond' ? condScreen() : dayScreen();
  phone.innerHTML = `<div class="screen ${S.toast ? 'app--toast' : ''}">${base}
    ${S.sheet === 'vet' ? vetSheet() : ''}${S.sheet === 'add' ? addDocSheet() : ''}${S.docEdit ? docSheet() : ''}${S.picker ? pickerSheet() : ''}
    ${S.viewer ? viewer() : ''}${toast()}</div>`;
  phone.querySelectorAll('.sheet__body, .day__body').forEach((el, i) => { if (keep[i] != null) el.scrollTop = keep[i]; });
  document.documentElement.lang = S.lang;
  renderPanel();
  void open;
}
const PRESETS = [
  ['day', 'Day view: PDF rows in the cards'], ['viewer', 'Open a PDF (simulated iOS viewer)'], ['form', 'Vet visit form with documents'],
  ['picker', 'Choose a file (simulated Files)'], ['toobig', 'File over the limit'], ['uploading', 'Upload in progress'], ['failed', 'Upload failed'],
  ['docedit', 'Document sheet: rename, open, remove'], ['removed', 'Removed, with Undo'], ['lump', 'Condition page: Lump A (photos and PDF)'],
  ['stomach', 'Condition page: Stomach trouble'], ['empty', 'Condition page: no documents'], ['add', 'Add document from the condition'],
];
function renderPanel() {
  const p = document.getElementById('panel');
  p.innerHTML = `<h1>PDF on events and conditions</h1><p>JCB-76 design proposal. Clickable; data is fictional. Changes reset on reload. Prototype clock: Thu 15 Oct.</p>
    <h2>Language</h2><div style="display:flex;gap:6px"><button class="go" style="width:auto;flex:1" data-act="lang" data-v="en" aria-current="${S.lang === 'en'}">EN</button><button class="go" style="width:auto;flex:1" data-act="lang" data-v="pl" aria-current="${S.lang === 'pl'}">PL</button></div>
    <h2>Jump to</h2>${PRESETS.map(([k, v]) => `<button class="go" data-act="preset" data-v="${k}" aria-current="${S.preset === k}">${v}</button>`).join('')}
    <h2>Simulate</h2><label><input type="checkbox" data-bind="fail" ${S.fail ? 'checked' : ''}> Uploads fail at 60%</label>`;
}

// ---------- Behaviour ----------
function toastShow(text, undo) {
  clearTimeout(toastTimer);
  S.toast = { text, undo };
  toastTimer = setTimeout(() => { S.toast = null; render(); }, undo ? 8000 : 5000);
}
function newDoc(file, name) {
  S.seq += 1;
  return { id: 'n' + S.seq, ev: null, name, kb: file.kb, pages: file.pages, status: 'ready', p: 0, isNew: true };
}
function pickInto(file) {
  const fname = file.file[S.lang].replace(/\.pdf$/i, '');
  if (file.kb > MAX_MB * 1024) {
    const msg = t('docTooBig', { name: file.file[S.lang], size: sizeText(file.kb) });
    if (S.addDoc) S.addDoc.err = msg; else S.form.err = msg;
    return;
  }
  const d = newDoc(file, fname);
  if (S.addDoc) { S.addDoc.file = d; S.addDoc.name = fname; S.addDoc.err = ''; } else { S.form.docs.push(d); S.form.err = ''; }
}
function startUpload(d, done) {
  d.status = 'uploading'; d.p = 0;
  if (S.freeze) { d.p = 62; return; }
  const id = setInterval(() => {
    d.p += 7;
    if (S.fail && d.p >= 60) { clearInterval(id); timers.delete(id); d.status = 'failed'; done(false); return; }
    if (d.p >= 100) { clearInterval(id); timers.delete(id); d.status = 'ready'; d.p = 100; done(true); return; }
    const bar = document.querySelector(`[data-bar="${d.id}"]`), pct = document.querySelector(`[data-pct="${d.id}"]`);
    if (bar) bar.style.setProperty('--p', d.p + '%');
    if (pct) pct.textContent = t('docUploading', { p: Math.round(d.p) });
  }, 110);
  timers.add(id);
}
function openForm(extra = {}) {
  S.sheet = 'vet';
  S.form = { ev: 'e016', docs: docsOf('e016').map((d) => ({ ...d })), err: '', saving: false, showFail: false, ...extra };
}
function saveForm() {
  const f = S.form;
  const pending = f.docs.filter((d) => d.isNew && d.status !== 'ready' || d.isNew && d.status === 'ready' && !d.saved);
  const todo = f.docs.filter((d) => d.isNew && !d.saved && !d.removed);
  if (!todo.length) return finishForm();
  f.saving = true; f.showFail = false; f.err = '';
  let left = todo.length, bad = 0;
  const settle = (ok) => {
    if (!ok) bad += 1;
    left -= 1;
    if (left === 0) {
      f.saving = false;
      if (bad) { f.showFail = true; render(); } else finishForm();
    } else render();
  };
  todo.forEach((d, i) => setTimeout(() => startUpload(d, settle), i * 250));
  void pending;
  render();
}
function finishForm() {
  const f = S.form;
  f.docs.filter((d) => d.isNew && !d.saved).forEach((d) => { d.saved = true; d.isNew = false; d.ev = f.ev; S.docs.push({ id: d.id, ev: f.ev, name: d.name, kb: d.kb, pages: d.pages }); });
  S.sheet = null; S.form = null; S.docEdit = null;
  toastShow(t('saved'), false);
  render();
}
function retry(id) {
  const f = S.form; const d = f && f.docs.find((x) => x.id === id);
  if (!d) return;
  f.showFail = false; f.saving = true;
  startUpload(d, (ok) => {
    f.saving = false;
    const rest = f.docs.filter((x) => x.isNew && !x.saved && x.status !== 'ready');
    if (!ok) { f.showFail = true; render(); } else if (!rest.length) finishForm(); else render();
  });
  render();
}
function saveAdd() {
  const a = S.addDoc; const d = a.file;
  d.name = a.name || d.name;
  startUpload(d, (ok) => {
    if (!ok) { a.err = t('docSaveFailed'); render(); return; }
    // Saved as a note on the chosen date, linked to the condition; the document is its attachment.
    const id = 'e' + (900 + S.seq);
    EVENTS[id] = { id, date: TODAY, type: 'note', title: d.name, detail: { en: '', pl: '' }, conds: [S.cond] };
    CONDS[S.cond].events.unshift(id);
    S.docs.push({ id: d.id, ev: id, name: d.name, kb: d.kb, pages: d.pages });
    S.sheet = null; S.addDoc = null;
    toastShow(t('saved'), false);
    render();
  });
  render();
}
function removeDoc() {
  const e = S.docEdit; const d = S.docs.find((x) => x.id === e.id);
  if (d) {
    d.removed = true; if (S.form) { const fd = S.form.docs.find((x) => x.id === e.id); if (fd) fd.removed = true; }
    S.docEdit = null;
    toastShow(t('docRemoved'), () => { d.removed = false; if (S.form) { const fd = S.form.docs.find((x) => x.id === e.id); if (fd) fd.removed = false; } });
  } else { // a picked file not saved yet: just drop it
    S.form.docs = S.form.docs.filter((x) => x.id !== e.id); S.docEdit = null;
  }
  render();
}
function clearTimers() { timers.forEach(clearInterval); timers.clear(); }

function preset(k) {
  clearTimers(); clearTimeout(toastTimer);
  const lang = S.lang, fail = S.fail;
  S = fresh(); S.lang = lang; S.fail = fail; S.preset = k;
  const pickPending = (i = 0, status = 'ready') => { const d = newDoc(FILES[i], FILES[i].file[S.lang].replace(/\.pdf$/i, '')); d.status = status; S.form.docs.push(d); return d; };
  switch (k) {
    case 'viewer': S.viewer = 'd1'; break;
    case 'form': openForm(); break;
    case 'picker': openForm(); S.picker = true; break;
    case 'toobig': openForm({ err: t('docTooBig', { name: FILES[2].file[S.lang], size: sizeText(FILES[2].kb) }) }); break;
    case 'uploading': openForm(); { const d = pickPending(0, 'uploading'); d.p = 62; S.form.saving = true; } break;
    case 'failed': openForm(); { pickPending(0, 'failed'); S.form.showFail = true; } break;
    case 'docedit': openForm(); S.docEdit = { id: 'd1', name: loc(DOCS[0].name) }; break;
    case 'removed': S.docs[1].removed = true; S.docs = S.docs.map((d) => d); toastShow(t('docRemoved'), () => { S.docs[1].removed = false; }); break;
    case 'lump': S.screen = 'cond'; S.cond = 'lump'; break;
    case 'stomach': S.screen = 'cond'; S.cond = 'stomach'; break;
    case 'empty': S.screen = 'cond'; S.cond = 'stomach'; S.docs[0].removed = true; S.docs[1].removed = true; break;
    case 'add': S.screen = 'cond'; S.cond = 'lump'; S.sheet = 'add'; { const d = newDoc(FILES[1], FILES[1].file[S.lang].replace(/\.pdf$/i, '')); S.addDoc = { file: d, name: d.name, err: '' }; } break;
    default: break;
  }
  render();
}

document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  switch (act) {
    case 'lang': S.lang = el.dataset.v; if (S.form) { S.form.err = ''; } render(); break;
    case 'preset': preset(el.dataset.v); break;
    case 'open': {
      const d = findDoc(el.dataset.doc);
      if (d) { S.viewer = d.id; render(); }
      break;
    }
    case 'viewerClose': S.viewer = null; render(); break;
    case 'editEvent': if (el.dataset.ev === 'e016') { openForm(); render(); } break;
    case 'sheetClose':
      if (S.picker) S.picker = null; else if (S.docEdit) S.docEdit = null; else { S.sheet = null; S.form = null; S.addDoc = null; }
      render(); break;
    case 'pick': S.picker = true; render(); break;
    case 'chooseFile': pickInto(FILES[+el.dataset.i]); S.picker = null; render(); break;
    case 'docedit': {
      const d = findDoc(el.dataset.doc);
      if (d) { S.docEdit = { id: d.id, name: loc(d.name) }; render(); }
      break;
    }
    case 'docSave': {
      const d = findDoc(S.docEdit.id);
      if (d) { d.name = S.docEdit.name || d.name; const g = S.docs.find((x) => x.id === d.id); if (g) g.name = d.name; }
      S.docEdit = null; render(); break;
    }
    case 'removeDoc': removeDoc(); break;
    case 'saveForm': saveForm(); break;
    case 'retry': retry(el.dataset.doc); break;
    case 'addDoc': S.sheet = 'add'; S.addDoc = { file: null, name: '', err: '' }; render(); break;
    case 'saveAdd': saveAdd(); break;
    case 'undo': { const u = S.toast && S.toast.undo; clearTimeout(toastTimer); S.toast = null; if (typeof u === 'function') u(); render(); break; }
    default: break;
  }
});
document.addEventListener('input', (ev) => {
  const b = ev.target.dataset && ev.target.dataset.bind;
  if (b === 'docName' && S.docEdit) S.docEdit.name = ev.target.value;
  if (b === 'addName' && S.addDoc) S.addDoc.name = ev.target.value;
});
document.addEventListener('change', (ev) => { if (ev.target.dataset && ev.target.dataset.bind === 'fail') S.fail = ev.target.checked; });

// Deep links, for example #lang=pl&screen=failed
(function boot() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('lang') === 'pl') S.lang = 'pl';
  if (h.get('fail') === '1') S.fail = true;
  const sc = h.get('screen');
  if (sc && PRESETS.some(([k]) => k === sc)) preset(sc); else render();
})();

</script>
</body>
